[package]
name = "skald"
version = "0.1.1"
edition = "2024"
description = "A focused desktop music player built with Rust and GPUI"
license = "MIT"

[dependencies]
# xattr 0.2.3 (via gpui's HTTP client) uses libc::ENOATTR on Linux. libc dropped
# that alias in 0.2.190, so keep the last release where xattr builds there.
libc = "=0.2.189"
anyhow = "1.0.104"
cpal = "0.18.2"
dirs = "7.0.0"
env_logger = "0.11.11"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
log = "0.4.34"
rfd = "0.17.2"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["mp3"] }
thiserror = "2.0.21"
walkdir = "2.5.0"

[profile.release]
lto = "thin"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSWindow",
    "NSEvent",
] }
